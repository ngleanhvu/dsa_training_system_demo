spring:
  application:
    name: dsa_training_system
  datasource:
    url: jdbc:mysql://localhost:3306/dsa_training_system_db_demo?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    password: 1234
    username: root
  flyway:
    locations: classpath:db/migration
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          public-key-location: classpath:keys/public-key.pem
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_ADDRESS}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true


  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: dsa_training_system_group_id
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  elasticsearch:
    uris: http://localhost:9200
    connection-timeout: 5s
    socket-timeout: 60s

aws:
  access_key_id: ${AWS_ACCESS_KEY_ID}
  secret_access_key: ${AWS_SECRET_ACCESS_KEY}
  region: ${AWS_REGION}
  s3_bucket_name: ${AWS_S3_BUCKET_NAME}

file:
  max_size: 5242880

piston:
  load_balancer: ${PISTON_LOAD_BALANCER}
  port: ${PISTON_PORT}

page:
  size: 20

jwt:
  expiration:
    access_token: 600
    refresh_token: 604800

server:
  port: 8000
  address: localhost




