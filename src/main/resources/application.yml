spring:
  application:
    name: dsa_training_system
  datasource:
    url: jdbc:mysql://localhost:3306/dsa_training_system_db_demo?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    password: 1234
    username: root
  flyway:
    locations: classpath:db/migration
    enabled: true

aws:
  access_key_id: ${AWS_ACCESS_KEY_ID}
  secret_access_key: ${AWS_SECRET_ACCESS_KEY}
  region: ${AWS_REGION}
  s3_bucket_name: ${AWS_S3_BUCKET_NAME}

file:
  max_size: 5242880

piston:
  load_balancer: ${PISTON_LOAD_BALANCER}
  port: ${PISTON_PORT}

server:
  port: 8000
